<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge Hub AI — Türkçe Teknik Kütüphane</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0f17">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">KH</div>
        <div>
          <div class="brand-title">Knowledge Hub AI</div>
          <div class="brand-sub">Türkçe Araştırma Kütüphanesi</div>
        </div>
      </div>

      <button class="nav-btn active" data-nav="library">📚 <span>Kütüphanem</span></button>
      <button class="nav-btn" data-nav="discover">🧭 <span>Keşfet</span></button>
      <button class="nav-btn" data-nav="listen">🎧 <span>Dinle</span></button>
      <button class="nav-btn" data-nav="settings">⚙️ <span>Ayarlar</span></button>

      <div class="sidebar-footer">
        <button id="openAddModalBtn" class="btn-primary">+ Yeni İçerik Ekle</button>
        <button id="themeToggleBtn" class="btn-ghost btn-sm">☀️ Açık Tema</button>
      </div>
    </aside>

    <main class="main-area">
      <div id="jobsBanner" class="jobs-banner hidden" aria-live="polite"></div>
      <div id="viewRoot"></div>
    </main>
  </div>

  <!-- Persistent Spotify-like Audio Player -->
  <section id="playerBar" class="player-bar hidden" aria-label="Ses oynatıcı">
    <div class="player-info">
      <div id="playerTitle" class="player-title">—</div>
      <div id="playerSub" class="player-sub">—</div>
    </div>
    <div class="player-controls">
      <div class="player-buttons">
        <button id="playerBack15" class="btn-sm" title="15 saniye geri">↺ 15sn</button>
        <button id="playerPlay" class="btn-primary btn-sm">▶ Oynat</button>
        <button id="playerFwd30" class="btn-sm" title="30 saniye ileri">30sn ↻</button>
      </div>
      <div class="player-seek-row">
        <span id="playerCurrentTime">0:00</span>
        <input id="playerSeek" type="range" min="0" max="1000" value="0" aria-label="Oynatma konumu">
        <span id="playerRemainingTime">0:00</span>
      </div>
    </div>
    <div class="player-extra">
      <select id="playerSpeed" aria-label="Oynatma hızı">
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <button id="playerDownload" class="btn-sm" title="Ses dosyasını indir">⬇ MP3</button>
      <button id="playerClose" class="btn-ghost btn-sm" title="Oynatıcıyı kapat">✕</button>
    </div>
  </section>

  <!-- Generic Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle" style="margin:0"></h3>
        <button id="modalCloseBtn" class="btn-ghost btn-sm" aria-label="Kapat">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
