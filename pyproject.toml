[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "knowledge-hub-ai"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]
[project.optional-dependencies]
media = ["faster-whisper>=1.1,<2", "pypdf>=5,<7", "defusedxml>=0.7,<1", "youtube-transcript-api>=1.0,<2"]
ai = ["openai>=1.66,<3"]
tts = ["supertonic>=1.3", "edge-tts>=7,<8"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
knowledge-hub = "knowledge_hub.cli:main"
[tool.setuptools.packages.find]
include = ["knowledge_hub*"]
[tool.setuptools.package-data]
knowledge_hub = ["static/*", "static/**/*"]
